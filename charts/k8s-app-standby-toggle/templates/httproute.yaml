{{- with .Values.httpRoute }}
{{- if .enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "standby.fullname" $ }}
  labels:
    {{- include "standby.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .parentRefs | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The UI, the API and the login flow. /metrics, /healthz and /readyz
    # are not routed.
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /auth/
        - path:
            type: PathPrefix
            value: /ui/
        - path:
            type: PathPrefix
            value: /static/
      backendRefs:
        - name: {{ include "standby.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
