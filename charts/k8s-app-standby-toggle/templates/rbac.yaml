# Cluster-wide: read Argo CD Applications, scale and suspend the kinds the
# service acts on, and review tokens. No delete, no pods, no Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "standby.fullname" . }}
  labels:
    {{- include "standby.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, patch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, patch]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "standby.fullname" . }}
  labels:
    {{- include "standby.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "standby.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "standby.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Own namespace: create the state ConfigMap once, then read and update only
# that one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "standby.fullname" . }}
  labels:
    {{- include "standby.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ include "standby.stateConfigMap" . }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "standby.fullname" . }}
  labels:
    {{- include "standby.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "standby.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "standby.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
