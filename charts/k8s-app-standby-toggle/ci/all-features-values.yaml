groups:
  identity:
    default: always-on
    apps: [lldap, authelia-infra, authelia, authelia-valkey]
  vikunja:
    default: awake
    apps: [vikunja, vikunja-infra]
  nextcloud:
    default: asleep
    apps: [nextcloud, nextcloud-infra, nextcloud-valkey]
oidc:
  issuerURL: https://auth.example.com
  allowedGroups: [admins, developers]
  ca:
    configMap: authelia-ca
  sessionKeySecret:
    name: standby-session
machineAuth:
  subjects:
    - system:serviceaccount:ci-runner:ci-runner
httpRoute:
  enabled: true
  parentRefs:
    - name: gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - standby.example.com
metrics:
  serviceMonitor:
    enabled: true
wakeDurations: [30m, 1h, 4h, 24h]
hold:
  defaultDuration: 24h
  maxDuration: 72h
log:
  format: text
