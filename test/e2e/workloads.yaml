# Workloads of the "demo" Application. worker starts at 0 replicas and must
# stay at 0 after a sleep and wake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: demo
spec:
  replicas: 1
  serviceName: cache
  selector:
    matchLabels: {app: cache}
  template:
    metadata:
      labels: {app: cache}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10.1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup
  namespace: demo
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pause
              image: registry.k8s.io/pause:3.10.1
